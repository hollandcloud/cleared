name: Cleared
options:
  bundleIdPrefix: net.hlnd
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# AppStore is Release plus the App Sandbox, which the Mac App Store requires.
# It is its own configuration so the direct build stays unsandboxed — the
# sandbox is what stops Cleared reading an existing `gh` login.
configs:
  Debug: debug
  Release: release
  AppStore: release

# Cleared.xcconfig optionally includes Local.xcconfig. Pointing at
# Local.xcconfig directly would fail on every clone that does not have one.
configFiles:
  Debug: Cleared.xcconfig
  Release: Cleared.xcconfig
  AppStore: Cleared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "3"
    # Ad-hoc by default so anyone can clone and build with no Apple account.
    # Override both in Local.xcconfig (gitignored) for a stable signature that
    # keeps the Keychain entry valid across rebuilds — see Local.xcconfig.example.
    # CLEARED_SIGN_* are intentionally left undefined here — a value set in
    # project.yml would outrank Local.xcconfig and the override would never
    # apply. The :default= operator supplies the ad-hoc fallback instead.
    CODE_SIGN_IDENTITY: "$(CLEARED_SIGN_IDENTITY:default=-)"
    CODE_SIGN_STYLE: "$(CLEARED_SIGN_STYLE:default=Automatic)"
    DEAD_CODE_STRIPPING: YES
  configs:
    # Required for notarization. Release only: the unit tests are injected
    # into a Debug build, which library validation would refuse.
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES
    # Signed under whichever team will submit to the store, which need not be
    # the one used for day-to-day builds. Both values come from Local.xcconfig
    # and fall back to ad-hoc, so this configuration still builds on a fresh
    # clone and in CI. Set here rather than left to the xcconfig because the
    # day-to-day DEVELOPMENT_TEAM would otherwise apply.
    AppStore:
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_ENTITLEMENTS: Resources/Cleared.entitlements
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "$(CLEARED_APPSTORE_IDENTITY:default=-)"
      DEVELOPMENT_TEAM: "$(CLEARED_APPSTORE_TEAM:default=)"

targets:
  Cleared:
    type: application
    platform: macOS
    sources:
      - path: Sources/Cleared
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.hlnd.Cleared
        PRODUCT_NAME: Cleared
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  ClearedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClearedTests
    dependencies:
      - target: Cleared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hlnd.ClearedTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cleared:
    build:
      targets:
        Cleared: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearedTests
    # Product → Archive in Xcode builds the sandboxed App Store configuration,
    # so distributing to App Store Connect needs no further setup.
    archive:
      config: AppStore
