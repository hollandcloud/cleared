name: Cleared
options:
  bundleIdPrefix: net.hlnd
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Cleared:
    type: application
    platform: macOS
    sources:
      - path: Sources/Cleared
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.hlnd.Cleared
        PRODUCT_NAME: Cleared
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  ClearedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClearedTests
    dependencies:
      - target: Cleared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hlnd.ClearedTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cleared:
    build:
      targets:
        Cleared: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearedTests
