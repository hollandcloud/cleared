name: Cleared
options:
  bundleIdPrefix: net.hlnd
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default so anyone can clone and build with no Apple account.
    # Override both in Local.xcconfig (gitignored) for a stable signature that
    # keeps the Keychain entry valid across rebuilds — see Local.xcconfig.example.
    # CLEARED_SIGN_* are intentionally left undefined here — a value set in
    # project.yml would outrank Local.xcconfig and the override would never
    # apply. The :default= operator supplies the ad-hoc fallback instead.
    CODE_SIGN_IDENTITY: "$(CLEARED_SIGN_IDENTITY:default=-)"
    CODE_SIGN_STYLE: "$(CLEARED_SIGN_STYLE:default=Automatic)"
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES

targets:
  Cleared:
    type: application
    platform: macOS
    sources:
      - path: Sources/Cleared
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: net.hlnd.Cleared
        PRODUCT_NAME: Cleared
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  ClearedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ClearedTests
    dependencies:
      - target: Cleared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hlnd.ClearedTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cleared:
    build:
      targets:
        Cleared: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearedTests
