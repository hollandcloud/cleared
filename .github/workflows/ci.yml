name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest toolchain the README promises, and the current one.
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Scan for credentials
        run: make scan

      # No Local.xcconfig here, so this is also the proof that a fresh clone
      # builds with ad-hoc signing and nothing to set up.
      - name: Build and test
        run: make test

      - name: Release build
        run: make release

      # The sandboxed configuration that goes to the Mac App Store. Ad-hoc
      # signed here, which is enough to prove it compiles and carries the
      # sandbox entitlement.
      - name: App Store build
        run: |
          make appstore-build
          codesign --display --entitlements - --xml build/appstore/Build/Products/AppStore/Cleared.app \
            | plutil -convert json -o - - | grep -q '"com.apple.security.app-sandbox":true'
